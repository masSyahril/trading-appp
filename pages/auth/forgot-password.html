<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="auth.forgotPassword.pageTitle">Forgot Password - TradeLite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth-theme.css">
</head>
<body class="tl-auth-body">
  <div style="position:fixed; top:16px; right:16px; z-index:60;" data-tl-lang-switcher></div>
  <a class="tl-auth-brand" href="../../index.html">📊 <span>TradeLite</span></a>

  <div class="tl-auth-card">
    <h1 class="tl-auth-title" data-i18n="auth.forgotPassword.title">Reset your password</h1>
    <p class="tl-auth-subtitle" data-i18n="auth.forgotPassword.subtitle">Enter your account email and we'll send a reset link.</p>

    <div id="alert-box"></div>

    <form id="forgot-form" novalidate>
      <div class="tl-field">
        <label for="email" data-i18n="auth.forgotPassword.emailLabel">Email</label>
        <input class="tl-input" type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <button class="tl-btn tl-btn-primary" type="submit" id="submit-btn" data-i18n="auth.forgotPassword.submit">Send reset link</button>
    </form>

    <p class="tl-auth-footer">
      <span data-i18n="auth.forgotPassword.rememberedIt">Remembered it?</span> <a href="login.html" data-i18n="auth.forgotPassword.signInLink">Sign in</a>
    </p>
  </div>

  <a class="tl-back-link" href="../../index.html" data-i18n="auth.backToTradeLite">&larr; Back to TradeLite</a>

  <script src="../../i18n/i18n.js"></script>
  <script src="../../i18n/lang-switcher.js"></script>
  <script src="auth-client.js"></script>
  <script>
    function t(key, vars) {
      return window.TLI18n ? window.TLI18n.t(key, vars) : key;
    }

    const form = document.getElementById('forgot-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');

    function showAlert(kind, message) {
      alertBox.innerHTML = `<div class="tl-alert tl-alert-${kind}">${message}</div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      const email = document.getElementById('email').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="tl-spinner"></span>${t('auth.forgotPassword.submitting')}`;
      try {
        const res = await TLAuth.forgotPassword(email);
        showAlert('success', res.message || t('auth.forgotPassword.genericSuccess'));
        form.reset();
      } catch (err) {
        showAlert('error', err.message || t('auth.forgotPassword.genericError'));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = t('auth.forgotPassword.submit');
      }
    });
  </script>
</body>
</html>
