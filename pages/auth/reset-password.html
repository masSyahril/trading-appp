<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="auth.resetPassword.pageTitle">Set a New Password - TradeLite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth-theme.css">
</head>
<body class="tl-auth-body">
  <div style="position:fixed; top:16px; right:16px; z-index:60;" data-tl-lang-switcher></div>
  <a class="tl-auth-brand" href="../../index.html">📊 <span>TradeLite</span></a>

  <div class="tl-auth-card">
    <h1 class="tl-auth-title" data-i18n="auth.resetPassword.title">Set a new password</h1>
    <p class="tl-auth-subtitle" data-i18n="auth.resetPassword.subtitle">Choose a new password for your account.</p>

    <div id="alert-box"></div>

    <form id="reset-form" novalidate>
      <div class="tl-field">
        <label for="password" data-i18n="auth.resetPassword.newPasswordLabel">New password</label>
        <input class="tl-input" type="password" id="password" name="password" autocomplete="new-password" required>
        <div class="tl-hint" data-i18n="auth.resetPassword.passwordHint">At least 8 characters, with a letter and a number.</div>
      </div>
      <button class="tl-btn tl-btn-primary" type="submit" id="submit-btn" data-i18n="auth.resetPassword.submit">Update password</button>
    </form>

    <p class="tl-auth-footer">
      <a href="login.html" data-i18n="auth.resetPassword.backToSignIn">Back to sign in</a>
    </p>
  </div>

  <a class="tl-back-link" href="../../index.html" data-i18n="auth.backToTradeLite">&larr; Back to TradeLite</a>

  <script src="../../i18n/i18n.js"></script>
  <script src="../../i18n/lang-switcher.js"></script>
  <script src="auth-client.js"></script>
  <script>
    function t(key, vars) {
      return window.TLI18n ? window.TLI18n.t(key, vars) : key;
    }

    const form = document.getElementById('reset-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');
    const token = new URLSearchParams(window.location.search).get('token') || '';

    function showAlert(kind, message) {
      alertBox.innerHTML = `<div class="tl-alert tl-alert-${kind}">${message}</div>`;
    }

    function checkToken() {
      if (!token) {
        showAlert('error', t('auth.resetPassword.missingToken'));
        form.querySelectorAll('input, button').forEach((el) => (el.disabled = true));
      }
    }
    if (window.TLI18n && window.TLI18n.ready) { window.TLI18n.ready.then(checkToken); } else { checkToken(); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="tl-spinner"></span>${t('auth.resetPassword.submitting')}`;
      try {
        const res = await TLAuth.resetPassword(token, password);
        showAlert('success', (res.message || 'Password updated.') + ' ' + t('auth.resetPassword.redirecting'));
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } catch (err) {
        showAlert('error', err.message || t('auth.resetPassword.genericError'));
        submitBtn.disabled = false;
        submitBtn.textContent = t('auth.resetPassword.submit');
      }
    });
  </script>
</body>
</html>
