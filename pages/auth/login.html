<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="auth.login.pageTitle">Sign In - TradeLite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Appearance (light/dark) is set before the stylesheet loads so the page never
     flashes the wrong theme; the key/attribute are shared with every other page. -->
<script>(function(){try{var t=localStorage.getItem('tl-appearance')||'dark';document.documentElement.setAttribute('data-appearance',t);document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="../../assets/theme/theme.css">
<link rel="stylesheet" href="auth-theme.css">
</head>
<body class="tl-auth-body">
  <div style="position:fixed; top:16px; right:16px; z-index:60; display:flex; align-items:center; gap:8px;">
    <div data-tl-theme-toggle></div>
    <div data-tl-lang-switcher></div>
  </div>
  <a class="tl-auth-brand" href="../../index.html">📊 <span>TradeLite</span></a>

  <div class="tl-auth-card">
    <h1 class="tl-auth-title" data-i18n="auth.login.title">Sign in</h1>
    <p class="tl-auth-subtitle" data-i18n="auth.login.subtitle">Welcome back. Enter your details to continue.</p>

    <div id="alert-box"></div>

    <form id="login-form" novalidate>
      <div class="tl-field">
        <label for="email" data-i18n="auth.login.emailLabel">Email</label>
        <input class="tl-input" type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="tl-field">
        <label for="password" data-i18n="auth.login.passwordLabel">Password</label>
        <input class="tl-input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="tl-btn tl-btn-primary" type="submit" id="submit-btn" data-i18n="auth.login.submit">Sign in</button>
    </form>

    <p class="tl-auth-footer">
      <a href="forgot-password.html" data-i18n="auth.login.forgotPassword">Forgot your password?</a>
    </p>
    <p class="tl-auth-footer">
      <span data-i18n="auth.login.noAccount">Don't have an account?</span> <a href="register.html" data-i18n="auth.login.registerLink">Register</a>
    </p>
  </div>

  <a class="tl-back-link" href="../../index.html" data-i18n="auth.backToTradeLite">&larr; Back to TradeLite</a>

  <script src="../../i18n/i18n.js"></script>
  <script src="../../i18n/lang-switcher.js"></script>
  <script src="../../assets/theme/theme.js" defer></script>
  <script src="auth-client.js"></script>
  <script>
    function t(key, vars) {
      return window.TLI18n ? window.TLI18n.t(key, vars) : key;
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');

    function showAlert(kind, message) {
      alertBox.innerHTML = `<div class="tl-alert tl-alert-${kind}">${message}</div>`;
    }

    // If a session already exists, don't make the user log in again.
    TLAuth.me().then((res) => {
      if (res.authenticated) window.location.href = '../../index.html';
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="tl-spinner"></span>${t('auth.login.submitting')}`;
      try {
        await TLAuth.login(email, password);
        window.location.href = '../../index.html';
      } catch (err) {
        showAlert('error', err.message || 'Sign in failed.');
        submitBtn.disabled = false;
        submitBtn.textContent = t('auth.login.submit');
      }
    });
  </script>
</body>
</html>
