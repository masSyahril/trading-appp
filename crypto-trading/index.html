    <style>
        /* Crypto layout: fixed main chart + predictable indicator panel heights; scroll inside #indicators-container */
        :root {
            --crypto-main-chart-height: 300px;
            --crypto-indicator-chart-height: 156px;
            --crypto-touch-min: 44px;
            /* Chart/indicator canvas colors (read in JS via getComputedStyle -
               see crypto-app.prod.js's readThemeVar/applyLiveChartTheme and
               multi-indicator-system.js's readIndicatorThemeVar/refreshTheme,
               since a <canvas> chart's colors are JS options, not CSS, and
               don't follow the light/dark toggle on their own). */
            --cc-bg: #020617;
            --cc-text: #e2e8f0;
            --cc-border: #1e293b;
            --cc-grid: #13202e;
            /* Asian-style candles: rising = red, falling = green (see setupChart) */
            --cc-up: #ef4444;
            --cc-down: #10b981;
        }
        html[data-appearance="light"] {
            --cc-bg: #ffffff;
            --cc-text: #1e293b;
            --cc-border: #e2e8f0;
            --cc-grid: #eef1f6;
            --cc-up: #dc2626;
            --cc-down: #059669;
        }
        /* Android / mobile: dynamic viewport + legacy Chrome fallback (address bar) */
        html {
            height: 100%;
            height: -webkit-fill-available;
        }
        body {
            min-height: 100%;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            background-color: #020617;
            color: #e2e8f0;
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        [data-appearance="light"] body {
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* Every hardcoded Tailwind slate utility class this page uses is
           re-mapped for light appearance once, shared with the other
           Tailwind-based pages - see assets/theme/theme.css. */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .indicator-panel { transition: all 0.3s ease-in-out; }
        #chart {
            height: var(--crypto-main-chart-height) !important;
            min-height: var(--crypto-main-chart-height) !important;
            max-height: var(--crypto-main-chart-height) !important;
            flex-shrink: 0 !important;
            box-sizing: border-box;
            width: 100%;
            touch-action: pan-x pan-y pinch-zoom;
        }
        /* Fills remaining space under the chart; no vh/min-height fights */
        #indicators-section {
            flex: 1 1 0 !important;
            min-height: 0 !important;
            max-height: none !important;
            height: auto !important;
            overflow: hidden !important;
            overscroll-behavior-y: contain;
        }
        @media (max-width: 768px) {
            :root {
                /* Shorter phones: cap chart with dvh so indicators keep room */
                --crypto-main-chart-height: min(240px, 32dvh);
                --crypto-indicator-chart-height: 120px;
            }
            #indicators-section {
                flex: 1 1 0 !important;
                min-height: 0 !important;
                max-height: none !important;
            }
        }
        @media (max-width: 480px) {
            :root {
                --crypto-main-chart-height: min(220px, 30dvh);
                --crypto-indicator-chart-height: 112px;
            }
        }
        /* Landscape phone: leave vertical room for indicators */
        @media (max-height: 500px) and (orientation: landscape) {
            :root {
                --crypto-main-chart-height: min(180px, 38vh);
                --crypto-indicator-chart-height: 100px;
            }
        }
        #indicators-container {
            overflow-y: auto !important;
            overflow-x: hidden !important;
            flex: 1 1 0 !important;
            min-height: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
            box-sizing: border-box;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        #sidebar { width: 200px !important; }
        /* Mobile order rail: bounded height + internal scroll (Android stack layout) */
        .crypto-order-rail {
            flex-shrink: 0;
        }
        @media (max-width: 1023px) {
            .crypto-order-rail {
                max-height: min(38dvh, 300px);
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior-y: contain;
            }
        }
        @media (max-width: 1023px) {
            .crypto-touch-target {
                min-height: var(--crypto-touch-min);
                min-width: var(--crypto-touch-min);
                touch-action: manipulation;
            }
            .crypto-chart-toolbar-mobile button.tab-btn,
            .crypto-chart-toolbar-mobile button[type="button"] {
                min-height: 36px;
                min-width: 36px;
                padding-left: 0.5rem;
                padding-right: 0.5rem;
                font-size: 11px;
            }
        }
        /* Panels stack at natural height; scroll the container (override shared multi-indicator flex-grow) */
        #indicators-container .indicator-panel:not(.minimized) {
            flex: 0 0 auto !important;
            min-height: 0 !important;
            max-height: none !important;
        }
        #indicators-container .indicator-panel:not(.minimized) .indicator-chart {
            height: var(--crypto-indicator-chart-height) !important;
            min-height: var(--crypto-indicator-chart-height) !important;
            max-height: var(--crypto-indicator-chart-height) !important;
            flex: 0 0 auto !important;
        }
        .indicator-panel.minimized {
            flex: 0 0 40px !important;
            min-height: 40px !important;
            max-height: 40px !important;
            height: 40px !important;
        }
        #chart-toolbar { transition: opacity 0.2s ease; }
        #chart-toolbar:hover {
            background: rgba(15, 23, 42, 0.95) !important;
        }
        #chart-toolbar button {
            user-select: none;
            -webkit-user-select: none;
        }
        .crypto-orders-scroll { max-height: 140px; overflow-y: auto; }
        @media (max-width: 1023px) {
            .crypto-orders-scroll { max-height: 120px; }
        }
    </style>
</head>

        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');
        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            } 
        }
        document.getElementById('menu-btn')?.addEventListener('click', toggleSidebar);
        document.getElementById('close-sidebar')?.addEventListener('click', toggleSidebar);
        backdrop?.addEventListener('click', toggleSidebar);
